name: Render Keep-Alive 24/7 Pinger

on:
  schedule:
    # Runs every 10 minutes (Render spins down after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Render Live Service
        run: |
          echo "Pinging RAG Pipeline on Render to prevent sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://retrieval-augmented-generation-pipeline.onrender.com/health")
          echo "Render Health Endpoint Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Server is awake and active."
          else
            echo "WARNING: Server responded with HTTP status $HTTP_STATUS. Attempting root path ping..."
            curl -s -o /dev/null --max-time 45 "https://retrieval-augmented-generation-pipeline.onrender.com/"
          fi
