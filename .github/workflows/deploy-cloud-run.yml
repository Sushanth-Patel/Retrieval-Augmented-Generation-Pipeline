name: Build, Test & Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO: agentic-rag
  SERVICE: agentic-rag-pipeline
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-rag/agentic-rag-pipeline

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Unit & Integration Tests (always runs — gate on green CI before deploy)
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pytest suite
        run: pytest tests/ -v --tb=short
        env:
          # Run all tests against the deterministic LocalMockLLM engine —
          # no live API calls during CI (free, instant, zero rate-limit risk)
          FORCE_MOCK: "true"

      - name: Verify Docker container build
        run: docker build -t agentic-rag-test:latest .


  # ---------------------------------------------------------------------------
  # Job 2: Build & Deploy to Cloud Run (only on push to main, after tests pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Build Container & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation (keyless auth)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keyless authentication via Workload Identity Federation —
      # no long-lived JSON key stored in GitHub secrets.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build multi-stage container and push to Artifact Registry.
      # Cache layers via Artifact Registry's built-in cache backend for fast re-builds.
      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
          platforms: linux/amd64

      # Deploy the new image revision to Cloud Run using the declarative YAML manifest.
      # Secrets are bound directly from Google Secret Manager (never in CI env vars).
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      # Smoke test: wait for the new revision's health probe to pass.
      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "Deployed to: $SERVICE_URL"
          # Wait up to 60s for the new revision to become healthy
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1
