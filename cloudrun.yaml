apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentic-rag-pipeline
  labels:
    app: agentic-rag
    tier: production
  annotations:
    # Google Cloud Run-specific scaling and ingress controls
    run.googleapis.com/ingress: "all"
    run.googleapis.com/ingress-status: "all"
spec:
  template:
    metadata:
      annotations:
        # Concurrency: 10 concurrent requests per instance
        # At ~3,000 tokens/query and 7,200 TPM: realistically 2 live concurrent users per
        # minute per instance without pacing; mock-mode supports full 10 concurrently.
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/minScale: "0"         # Scales to zero when idle ($0 base cost)
        run.googleapis.com/execution-environment: gen2  # Faster cold starts, full Linux compat
        run.googleapis.com/startup-cpu-boost: "true"   # Extra CPU during cold start initialization

    spec:
      containerConcurrency: 10
      timeoutSeconds: 120

      # Non-root security context — matches Dockerfile USER appuser (UID 10001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001

      containers:
        - image: us-central1-docker.pkg.dev/${PROJECT_ID}/agentic-rag/agentic-rag-pipeline:latest
          name: rag-api

          resources:
            limits:
              cpu: "1"
              memory: "1Gi"

          ports:
            - name: http1
              containerPort: 8080

          # Runtime secrets injected from Google Secret Manager (never baked into image)
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: latest
            - name: TEAM_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: team-api-keys
                  key: latest
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"

          # Startup probe: wait up to 60s for cold start (ChromaDB index loading)
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          # Liveness probe: restart unhealthy instances
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          # Readiness probe: remove from load balancer if unhealthy
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

  traffic:
    - percent: 100
      latestRevision: true
