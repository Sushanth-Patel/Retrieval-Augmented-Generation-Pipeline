services:
  - type: web
    name: retrieval-augmented-generation-pipeline
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FORCE_MOCK
        value: "true"
      - key: XDG_CACHE_HOME
        value: "/tmp/.cache"
