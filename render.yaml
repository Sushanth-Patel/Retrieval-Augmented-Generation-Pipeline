services:
  - type: web
    name: retrieval-augmented-generation-pipeline
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FORCE_MOCK
        value: "true"
      - key: USE_LIGHTWEIGHT_EMBEDDINGS
        value: "true"
      - key: XDG_CACHE_HOME
        value: "/tmp/.cache"
