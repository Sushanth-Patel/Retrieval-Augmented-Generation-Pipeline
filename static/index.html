<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agentic RAG Pipeline Workspace.">
  <title>RAG Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="macro-theme">
  <!-- Atmospheric Fog & Misty Forest Backdrop -->
  <div class="macro-bg-canvas"></div>
  <div class="macro-bg-vignette"></div>

  <!-- Main Floating Window Container Shell -->
  <div class="macro-window-frame">
    
    <!-- Left Glassmorphic Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="brand-text">
            <h2>RAG Pipeline</h2>
          </div>
        </div>

        <button id="new-chat-btn" class="btn-create-amber" title="New Session (Ctrl+K)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>
      </div>

      <!-- Navigation & Sections -->
      <div class="sidebar-section flex-grow">
        <!-- History / Active Conversations Section -->
        <div class="nav-section-title">Workspace History</div>
        <div class="chats-list" id="chats-list">
          <!-- Populated by app.js -->
        </div>
      </div>

      <!-- Sidebar Bottom Profile Footer -->
      <div class="sidebar-footer">
        <div class="user-card-minimal">
          <div class="avatar-amber">R</div>
          <div class="user-details">
            <span class="user-name">RAG Workspace</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Content Panel -->
    <main class="main-panel">
      <!-- HUD Top Navigation Bar -->
      <header class="top-nav-macro">
        <div class="nav-left">
          <button id="toggle-sidebar-btn" class="icon-btn-macro" title="Toggle Navigation Sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          <div class="active-chat-title-macro" id="active-chat-title">New Conversation</div>
        </div>

        <div class="nav-right">
          <div class="hud-status-badge">
            <span class="status-dot online" id="backend-status-dot"></span>
            <span class="status-text" id="backend-status-text">Connected</span>
          </div>
        </div>
      </header>

      <!-- Central Viewport -->
      <div class="chat-viewport" id="chat-viewport">
        <!-- Floating Welcome Hero (Macro Style) -->
        <div class="welcome-container" id="welcome-container">
          <div class="macro-hero-center">
            <div class="macro-brand-glow">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
              </svg>
            </div>
            <h1 class="macro-hero-greeting" id="hero-greeting">How can I help you today?</h1>
          </div>
        </div>

        <!-- Dynamic Conversation Stream -->
        <div class="messages-stream" id="messages-stream">
          <!-- Messages dynamically rendered here -->
        </div>
      </div>

      <!-- Floating Capsule Prompt Composer (Macro Centered Style) -->
      <div class="composer-container">
        <div class="macro-composer-card">
          <div class="composer-input-row">
            <textarea id="chat-input" placeholder="Ask anything, mention files..." rows="1" autofocus></textarea>
          </div>

          <div class="composer-actions-row">
            <div class="action-left-group">
              <button id="composer-attach-btn" class="icon-btn-macro-subtle" title="Attach Document (.pdf, .docx, .xlsx, .md)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>

              <button id="web-toggle-pill" class="toggle-pill active" title="Toggle Live Web Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/>
                </svg>
                <span>Web Search</span>
              </button>
            </div>

            <div class="action-right-group">
              <button id="send-btn" class="btn-send-macro" disabled title="Send (Enter)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Document Ingestion Modal -->
  <div id="upload-modal" class="modal-overlay hidden">
    <div class="modal-card-macro">
      <div class="modal-header">
        <h2>Ingest &amp; Index Document</h2>
        <button id="close-upload-modal-btn" class="icon-btn-macro">&times;</button>
      </div>
      <p class="modal-desc">Supported formats: <code>.pdf</code>, <code>.docx</code>, <code>.xlsx</code>, <code>.md</code>, <code>.txt</code> &mdash; Max 10 MB.</p>

      <div id="upload-dropzone" class="upload-dropzone-macro">
        <div class="dropzone-inner">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="dropzone-label">Drag &amp; drop file here, or <button type="button" id="dropzone-browse-btn" class="btn-link">browse</button></p>
          <p class="dropzone-filename" id="dropzone-filename">No file selected</p>
          <input type="file" id="upload-file-input" accept=".pdf,.docx,.xlsx,.xls,.md,.txt,.json" style="display:none">
        </div>
      </div>

      <div id="upload-progress-wrap" class="upload-progress-wrap hidden" style="margin-top: 15px;">
        <div class="progress-bar-container" style="background: rgba(255,255,255,0.08); border-radius: 6px; height: 6px; overflow: hidden;">
          <div id="upload-progress-bar" class="progress-bar-fill" style="width: 100%; height: 100%; background: var(--amber-glow); animation: pulse 1.5s infinite;"></div>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; text-align: center;">Parsing, embedding &amp; indexing document into vector store...</p>
      </div>

      <div class="modal-actions">
        <button id="cancel-upload-btn" class="btn-ghost-macro">Cancel</button>
        <button id="submit-upload-btn" class="btn-amber-macro" disabled>Upload &amp; Ingest</button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=3"></script>
</body>
</html>
